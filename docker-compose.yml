services:

  client:
    build: ./client
    container_name: codebase-copilot-client
    ports:
      - "3000:3000"
    environment:
      - VITE_API_TARGET=http://server:5000
    volumes:
      - ./client/src:/app/src
    depends_on:
      - server
    restart: unless-stopped

  server:
    build: ./server
    container_name: codebase-copilot-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FASTAPI_INTERNAL_URL=http://fastapi:8000
    volumes:
      - ./server/src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      fastapi:
        condition: service_started
    restart: unless-stopped

  # Background Ingestion Workers (Scale with: docker compose up --scale worker=3)
  worker:
    build: ./server
    command: ["npm", "run", "worker"]
    env_file:
      - ./server/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FASTAPI_INTERNAL_URL=http://fastapi:8000
      - INGESTION_WORKER_CONCURRENCY=2
    volumes:
      - ./server/src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      fastapi:
        condition: service_started
      qdrant:
        condition: service_started
    restart: on-failure

  fastapi:
    build: ./RAG
    container_name: codebase-copilot-fastapi
    ports:
      - "8000:8000"
    env_file:
      - ./RAG/.env
    volumes:
      - ./RAG:/app
    depends_on:
      - qdrant
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: codebase-copilot-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: codebase-copilot-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:

  redis_data: