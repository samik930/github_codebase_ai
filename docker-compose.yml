services:

  server:
    build: ./server
    container_name: codebase-copilot-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: codebase-copilot-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage: