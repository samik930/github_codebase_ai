services:

  client:
    build: ./client
    container_name: codebase-copilot-client
    ports:
      - "3000:3000"
    environment:
      - VITE_API_TARGET=http://server:5000
    volumes:
      - ./client/src:/app/src
    depends_on:
      - server

  server:
    build: ./server
    container_name: codebase-copilot-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/src:/app/src
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: codebase-copilot-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage: